[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reproagent"
version = "0.1.0"
description = "A reproducibility auditor for open-source software."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "packaging>=24.0",
    "pydantic>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dev = [
    "build>=1.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
reproagent = "reproagent.cli:app"

[project.urls]
Repository = "https://github.com/emam26/ReproAgent"
Issues = "https://github.com/emam26/ReproAgent/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"reproagent.evaluation" = ["evaluation_set.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "docker: tests that require a working Docker daemon",
    "integration: integration tests using external system services",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
