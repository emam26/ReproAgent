[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reproagent"
version = "0.1.0"
description = "A reproducibility auditor for open-source software."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "packaging>=24.0",
    "pydantic>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dev = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
reproagent = "reproagent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reproagent.evaluation = ["evaluation_set.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "docker: tests that require a working Docker daemon",
    "integration: integration tests using external system services",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
